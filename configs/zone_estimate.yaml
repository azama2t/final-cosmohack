# Исследовательская оценка шт./км² для спутниковых зон (решение 26.09 12:58, п.2).
# Код: src/macroplastic/case/zone_estimate.py; сервис: service/case_store.py (_sz_enrich), выгрузка CSV/GeoJSON зон.
# Формула: N_зоны = n_пикселей_детектора × [lo; hi] предметов на пиксель; C = N_зоны / площадь_зоны (км²).
#   lo / hi = min / max «предметов на пиксель» по всем точкам калибровки ниже (все даты A*), округление до round_items_to;
#   value — геометрическое среднее границ: интервал мультипликативный (порядок величины), середина в лог-шкале.
# Обновление калибровки: дописать точки в calibration_points (новые даты A* от охоты за мишенями PLP и др.) —
#   интервал пересчитается сам при следующем запросе (кэш по mtime файла); чисел в коде нет.
version: 1
status: "исследовательская оценка"
status_id: research_estimate
unit: "шт./км²"
method: "калибровка на искусственных мишенях PLP (бутылки PET 1.5 л)"
note: "для природных скоплений не проверена; мелкие предметы → больше штук"
point: geometric_mean          # geometric_mean | midpoint
round_items_to: 10             # 466 / 666 → 470 / 670
sig_digits: 3                  # значащих цифр у шт./км² (value, lo, hi)
pixel_m2: 100                  # пиксель S2 10 × 10 м
source: >-
  reports/count_datasets/115_bridge_s2.md (§3.1 «Сработавшие пиксели», ИТОГ п.3): PLP2019, Topouzelis et al. 2020,
  Remote Sens. 12:2013, данные Zenodo 3752719 (CC BY 4.0); детектор weights/lgbm, порог 0.63, S2 L2A того же дня.
# Точки калибровки: пиксели S2, где детектор сработал (P ≥ 0.63) над мишенью с известной долей покрытия по дрону.
# items_per_pixel = bottles_fraction × pixel_m2 × bottles_per_m2 (если не задано явно полем items_per_pixel).
# bottles_per_m2 = 416 бутылок PET 1.5 л на мишень 5 × 5 м («26 lines with 16 bottles each») = 16.64 шт./м².
calibration_points:
  - date: "2019-04-18"
    level: "A*"
    campaign: PLP2019
    target: "A (4 модуля в линию), пиксель A2"
    s2_product: S2B_35SMD_20190418_0_L2A
    bottles_fraction: 0.28
    bags_fraction: 0.02          # пакеты: число не опубликовано, в штуки не пересчитываются
    bottles_per_m2: 16.64
    detector_p: 0.686
  - date: "2019-05-18"
    level: "A*"
    campaign: PLP2019
    target: "C (бутылки 2 × 5 м), пиксель C4"
    s2_product: S2B_35SMD_20190518_0_L2A
    bottles_fraction: 0.40
    bags_fraction: 0.0
    bottles_per_m2: 16.64
    detector_p: 0.867
# Что НЕ входит (для честности интервала): пиксели мишеней с долей ≥ 0.25, где детектор НЕ сработал (8 из 10 в 2019 г.),
# и PLP2018 (3 600 бутылок, P max 0.00) — они говорят о полноте детектора, а не о числе штук в сработавшем пикселе.
