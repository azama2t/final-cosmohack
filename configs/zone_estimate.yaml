# Исследовательская оценка шт./км² для спутниковых зон (решение 26.09 12:58, п.2).
# Код: src/macroplastic/case/zone_estimate.py; сервис: service/case_store.py (_sz_enrich), выгрузка CSV/GeoJSON зон.
# Формула: N_зоны = n_пикселей_детектора × [lo; hi] предметов на пиксель; C = N_зоны / площадь_зоны (км²).
#   lo / hi = min / max «предметов на пиксель» по всем точкам калибровки ниже (все даты A*), округление до round_items_to;
#   value — геометрическое среднее границ: интервал мультипликативный (порядок величины), середина в лог-шкале.
# Обновление калибровки: дописать точки в calibration_points (новые даты A* от охоты за мишенями PLP и др.) —
#   интервал пересчитается сам при следующем запросе (кэш по mtime файла); чисел в коде нет.
version: 1
status: "исследовательская оценка"
status_id: research_estimate
# Действующая калибровка (показывается в карточке). Если модель П3 когда-либо примут — сменить имя и id здесь.
calibration_id: flat_plp
calibration_name: "плоская калибровка по мишеням PLP (470–670 предметов-бутылок на пиксель)"
unit: "шт./км²"
method: "исследовательский сценарий: калибровка на искусственных мишенях PLP (бутылки PET 1.5 л)"
note: "для природных скоплений не проверена; мелкие предметы → больше штук"
# §36 п.2 (14:03): 470–670 предметов-бутылок на пиксель — исследовательский СЦЕНАРИЙ, не доверительный интервал.
# {lo}, {hi}, {cov_lo}, {cov_hi} подставляются из calibration_points (покрытие = bottles_fraction + bags_fraction, %).
scenario: >-
  исследовательский сценарий по искусственным мишеням PLP (допущения: предметы размера бутылки PET 1,5 л,
  покрытие пикселя {cov_lo}–{cov_hi} %): {lo}–{hi} предметов-бутылок на пиксель — не доверительный интервал и не
  проверено на природе
# §39 п.3 (15:26): карточка — сначала «Количество … не определено», сценарий — в свёрнутом блоке. {x} — число сценария
# (n × lo / площадь, 2 значащие цифры, не менялось), {cov_lo}/{cov_hi} — из calibration_points.
quantity_line: "Количество предметов по этому снимку не определено (перенос не подтверждён: нет природных пар; см. ISPRA 604)"
scenario_title: "Исследовательский сценарий (мишени PLP)"
scenario_line: >-
  ≈ {x} шт./км², если бы это были предметы размера бутылки 1.5 л при покрытии {cov_lo}–{cov_hi} % (искусственные
  мишени PLP); на природе не проверено; на оценщике хуже ответа «0»
scenario_status: "исследовательский сценарий: не результат, на природе не проверено"
# Оговорка к сценарию (П1, LOG 13:41 и 14:15, docs/research/pairs/p1_targets.csv): срабатывание не монотонно по числу.
# Интервал не меняется — это две сработавшие точки, не закон.
firing:
  n_water_pixels_ge400: 9       # пиксели воды «оценивается» с ≥ 400 бутылок PET 1,5 л (PLP2018 + PLP2019)
  n_fired: 2                    # сработали: 466 и 666 бут./пикс. (PLP2019)
  max_not_fired: 1670           # PLP2018: ≈ 1 670 бут./пикс., доля 0,46, P 0,000
  max_not_fired_campaign: PLP2018
  source: "docs/research/pairs/p1_targets.csv; docs/research/pairs/PAIRS.md (ИТОГ П1)"
# Природная пара ISPRA 604 (формулировка критика пар, docs/research/pairs/CRITIC.md): в context и natural_pair_note
# только при confirmed: true.
natural_pair:
  confirmed: true               # оркестратор, INBOX §38 п.6
  id: "ISPRA 604 (16.09.2019)"
  status: "подтверждено частично (П2 14:11, критик пар 14:21): ширина полосы и часовой пояс учёта 2019 г. не записаны"
  text: >-
    на природной паре ISPRA 604 (16.09.2019; протокол SNPA Modulo 2bis: предметы 2,5–50 см, 15 из 16 — полимеры; ширина
    полосы в файле 2019 г. не записана, протокол 2024 — ≤ 5 м; часовой пояс не указан) ни один из 16 предметов не ближе
    50 м к пикселю детектора, ближайший — 85 м; их суммарная площадь ~10⁻⁵ площади полосы — сигнал нити дают не
    посчитанные предметы
point: geometric_mean          # geometric_mean | midpoint
round_items_to: 10             # 466 / 666 → 470 / 670
sig_digits: 3                  # значащих цифр у шт./км² (value, lo, hi)
pixel_m2: 100                  # пиксель S2 10 × 10 м
source: >-
  reports/count_datasets/115_bridge_s2.md (§3.1 «Сработавшие пиксели», ИТОГ п.3): PLP2019, Topouzelis et al. 2020,
  Remote Sens. 12:2013, данные Zenodo 3752719 (CC BY 4.0); детектор weights/lgbm, порог 0.63, S2 L2A того же дня.
# Точки калибровки: пиксели S2, где детектор сработал (P ≥ 0.63) над мишенью с известной долей покрытия по дрону.
# items_per_pixel = bottles_fraction × pixel_m2 × bottles_per_m2 (если не задано явно полем items_per_pixel).
# bottles_per_m2 = 416 бутылок PET 1.5 л на мишень 5 × 5 м («26 lines with 16 bottles each») = 16.64 шт./м².
calibration_points:
  - date: "2019-04-18"
    level: "A*"
    campaign: PLP2019
    target: "A (4 модуля в линию), пиксель A2"
    s2_product: S2B_35SMD_20190418_0_L2A
    bottles_fraction: 0.28
    bags_fraction: 0.02          # пакеты: число не опубликовано, в штуки не пересчитываются
    bottles_per_m2: 16.64
    detector_p: 0.686
  - date: "2019-05-18"
    level: "A*"
    campaign: PLP2019
    target: "C (бутылки 2 × 5 м), пиксель C4"
    s2_product: S2B_35SMD_20190518_0_L2A
    bottles_fraction: 0.40
    bags_fraction: 0.0
    bottles_per_m2: 16.64
    detector_p: 0.867
# Что НЕ входит (для честности интервала): пиксели мишеней с долей ≥ 0.25, где детектор НЕ сработал (8 из 10 в 2019 г.),
# и PLP2018 (3 600 бутылок, P max 0.00) — они говорят о полноте детектора, а не о числе штук в сработавшем пикселе.
# §51 п.4 (эксперт: «подсвечивать крупные скопления — сотни метров или км²»; решение 26.09 вечер): «крупное скопление» —
# находка (is_find), у которой площадь маски детектора (пиксели, без буфера) ≥ large_mask_km2 ИЛИ большая ось её
# объектов детектора (наибольшее расстояние между вершинами выпуклой оболочки, без буфера) ≥ large_axis_m.
# Сработавшее условие — в поле large_reason.
large_mask_km2: 0.1
large_axis_m: 500
# §51 п.2 / п.3: независимая оценка по полю. «Район» зоны — полевые записи организаторов (C = N/A, не единичные
# предметы) не дальше field_region_km от центра зоны; для динамики по дате — не дальше field_max_days суток от снимка
# (эксперт: разрыв до 2 суток между полевым наблюдением и снимком).
field_region_km: 50
field_max_days: 2
# §51 п.2: профиль акватории, если ближе field_region_km полевых записей нет. Акватория района — по списку regions;
# данные: записи организаторов с sea_area из organizer_sea_areas (тот же метод, что в кейсе), иначе отрезки ADIS
# (судовая камера, > 5 см) внутри bbox [lon_min, lat_min, lon_max, lat_max] без прямоугольников exclude. Нужно не
# меньше min_n измерений. Интервал — 95 % бутстреп ΣN/ΣA по дням. Подпись: «профиль акватории по полевым данным —
# не измерение этого участка».
field_basins:
  - {id: mediterranean, name: "Средиземное море", regions: [cozar_demo, tiber, nile], organizer_sea_areas: [],
     bbox: [-5.6, 30.0, 36.5, 46.0], exclude: [[-6.0, 43.0, 0.0, 46.5], [26.0, 40.3, 42.0, 47.5]], min_n: 5}
  - {id: north_sea, name: "Северное море", regions: [scotland], organizer_sea_areas: ["North Sea"],
     bbox: [-4.0, 50.5, 10.0, 61.0], exclude: [[-4.0, 49.0, 1.3, 51.1], [-4.0, 58.0, -1.5, 61.5]], min_n: 5}
  - {id: caribbean, name: "Карибское море", regions: [honduras, haiti, santo_domingo], organizer_sea_areas: [],
     bbox: [-89.5, 9.3, -61.5, 22.5], exclude: [[-92.0, 8.0, -84.0, 14.5]], min_n: 5}
  - {id: sw_atlantic_brazil, name: "Юго-западная Атлантика у Бразилии", regions: [guanabara], organizer_sea_areas: [],
     bbox: [-50.0, -30.0, -35.0, -15.0], exclude: [], min_n: 5}
  - {id: south_china_sea, name: "Южно-Китайское море", regions: [manila, danang, mekong], organizer_sea_areas: [],
     bbox: [99.0, 0.0, 122.0, 23.0], exclude: [], min_n: 5}
  - {id: indonesian_seas, name: "Яванское море и пролив Бадунг", regions: [jakarta, bali], organizer_sea_areas: [],
     bbox: [105.0, -12.0, 120.0, -3.0], exclude: [], min_n: 5}
  - {id: arabian_sea, name: "Аравийское море", regions: [karachi, mumbai], organizer_sea_areas: [],
     bbox: [55.0, 5.0, 78.0, 26.0], exclude: [], min_n: 5}
  - {id: bay_of_bengal, name: "Бенгальский залив", regions: [ganges], organizer_sea_areas: [],
     bbox: [78.0, 5.0, 95.0, 23.0], exclude: [], min_n: 5}
  - {id: gulf_of_guinea, name: "Гвинейский залив", regions: [accra, lagos], organizer_sea_areas: [],
     bbox: [-10.0, -5.0, 12.0, 8.0], exclude: [], min_n: 5}
  - {id: sw_indian_agulhas, name: "Юго-западная часть Индийского океана (Агульяс)", regions: [durban],
     organizer_sea_areas: [], bbox: [25.0, -40.0, 40.0, -25.0], exclude: [], min_n: 5}
