# L56: ручные пометки артефактов (scripts/build_service_data.py, после автоматических).
# Объект, у которого есть пиксель в круге (lon, lat, radius_m) на этом районе/дате/модели ("*" = любая модель),
# получает properties.artifact = kind и properties.artifact_source = "manual" и дальше обрабатывается как любой
# артефакт: не входит в зоны, H3-индекс, временной ряд и n_confirmed. Вырезки и таблица: reports/manual_review.md.
# Сюда только очевидные следы судов / кильватеры / швы; сомнительное не помечается.
# kind: wake | ship | seam | other. lon/lat — центр объекта (properties.lon/lat в detections.geojson).
