# Пороги масок качества пар «событие ↔ сцена» (scripts/case/pair_quality.py; отчёт reports/case_pairs/quality.md).
# Все доли считаются по пикселям полосы наблюдения (линия трансекты + буфер или точка + буфер).
strip:
  point_buffer_m: 500        # если у события нет геометрии трансекты
  min_half_width_m: 10       # полуширина полосы не меньше 1 пикселя 10 м (ширина 10 м -> 5 м < пикселя)
  context_m: 3000            # контекст вокруг полосы для вырезки
  max_crop_m: 40000          # предел стороны вырезки
decision:
  min_coverage: 0.8          # доля полосы внутри сцены с валидными данными
  max_cloud_frac: 0.2        # облака/тени/перистые (SCL 3,8,9,10 + спектральный фильтр) от покрытой полосы
  max_land_frac: 0.5         # суша от покрытой полосы
  min_valid_water_frac: 0.5  # валидная вода от всей полосы
  glint_b11: 0.01            # медиана B11 по валидной воде полосы выше -> блик/дымка
  glint_scene_spc_frac: 0.5  # спектральный облачный тест сработал на >50% воды SCL-6 вырезки ...
  glint_scene_max_scl_cloud: 0.01  # ... а облаков SCL < 1% -> это блик, а не облака (код 6 в quality.tif)
detector:
  weights: weights/lgbm
  # Гармонизация каналов перед LightGBM: none | scene_median (сдвиг медианы воды сцены к медиане воды MARIDA,
  # = harmonize='water_median' живого контура). Решение 25.09 22:40 (docs/DECISIONS.md, коммит aebebf5): на снимках пар
  # выключена — выбор по MARIDA val, F1 0.923 без сдвига против 0.897 со сдвигом (reports/case_pairs/visual_review.md).
  # Прежние числа (до решения): pair_quality.py --harmonize scene_median.
  harmonize: none
  min_px: 1
  cloud_buffer_px: 5
network:
  workers: 4
  retries: 4

# Допуск синхронности пары по дрейфу (scripts/case/find_pairs.py; раздел «Допуск по дрейфу» в reports/case_pairs/summary.md).
# drift_shift_km = (u_current + windage * U_wind) * |dt|; при неизвестном времени |dt| + 12 ч (худший случай).
# Скорости сложены как сонаправленные (верхняя оценка смещения); приливные колебания не вычитаются.
# Источники-ориентиры:
#  - поверхностные течения: средние скорости дрифтеров 0.1–0.3 м/с в открытом океане, <0.1 м/с в центрах гиров,
#    >0.5 м/с в струйных течениях (Lumpkin & Johnson 2013, JGR Oceans 118:2992–3006, doi:10.1002/jgrc.20210);
#    Основное черноморское течение 0.2–0.5 м/с (Korotaev et al. 2003, JGR 108(C4):3122, doi:10.1029/2002JC001508);
#    остаточная циркуляция Северного моря ~0.05–0.1 м/с при приливных 0.5–1 м/с (Otto et al. 1990, Neth. J. Sea Res. 26:161–238).
#  - ветровой дрейф плавающего мусора (windage/leeway) 1–3 % скорости ветра на 10 м
#    (van Sebille et al. 2020, Environ. Res. Lett. 15:023003, doi:10.1088/1748-9326/ab6d7d).
#  ERA5/CDS не используются: ветер берётся только из wind_speed_kn реестра (есть только у S1), иначе только течение.
drift:
  scenarios:
    low:     {current_ms: 0.05, windage: 0.01}
    typical: {current_ms: 0.20, windage: 0.02}
    high:    {current_ms: 0.50, windage: 0.03}
  accept_scenario: typical     # accept требует drift_shift_km(typical) <= tolerance_km
  unknown_time_extra_h: 12     # дата без времени: |dt| + 12 ч
  tolerance:
    buffer_km: 3.0             # буфер контекста вокруг полосы (= strip.context_m)
    default_width_m: 10        # если ширина полосы в реестре не задана (S4)
    # tolerance_km = transect_width_m / 2 / 1000 + buffer_km

# Геометрия трансект S2/S3 по первоисточникам PANGAEA (src/macroplastic/case/geometry.py; data/case/geometry/transects.*).
# use: точка события = центр пути по сегментам, время = середина усилия (find_pairs.py; отключение: --no-geometry);
#      полоса наблюдения = сегменты + буфер, перерыв между сегментами не покрывается (pair_quality.py).
# allow_approx: использовать приближённо восстановленный конец S3 HE460_MarLitter_transect01 (reconstructed_approx);
#      false -> событие остаётся точкой начала (как в CSV организаторов).
# Площадь для концентрации не меняется: эталон — опубликованная площадь автора.
geometry:
  use: true
  allow_approx: true
