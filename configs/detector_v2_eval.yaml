  n_patches: 328
  n_scenes: 12
  n_labelled_px: 213102
  n_md_px: 1075
  metric: F1 of Marine Debris vs all other labelled pixels (pooled), pixels with NaN
    band -> not MD
  threshold: chosen on val per model, grid [0.02, 0.98, 0.01] (project convention,
    as weights/lgbm/meta.json); the same threshold is used on new data
  ci: scene bootstrap 2000 reps, numpy default_rng(0) (as scripts/baselines.py)
  seeds:
  - 0
  - 1
  - 2
new_data:
  grouping_key: 'acquisition = <S2 tile>_<YYYYMMDD> (pairs: from data/pairs/quality/<scene>/meta.json;
    extra: registry tile+date)'
  fold_rule: fold = int(sha256('detector_v2:' + key)[:8], 16) % 3
  protocol: '3-fold cross-fitting: objects of fold k are scored by a model trained
    on MARIDA train + MADOS + new data of the other folds (never its own acquisition);
    the final candidate is trained on all folds and is judged on MARIDA val only'
  pairs_visual:
    file: reports/case_pairs/visual_labels.csv
    sha256: d93ce50b72deb31f3304773958571d8288353529c267da93aa9e23d326211594
    labelled_by: AI agent, image chips, one annotator (L78b) - verified D, NOT field
      truth
    class_to_D:
      foam_whitecap: foam
      cloud: cloud
      glint: glint
      ship_wake: ship
      seam_artifact: artifact
    excluded:
      unclear: not verified
      accumulation: level C candidate - never a positive label
    train_confidence:
    - high
    - medium
    eval_confidence: all (high/medium/low reported separately)
    pixels: all pixels of the object bbox (bbox of a 1-8 px component; extra pixels
      are adjacent water, also not debris)
    band_cache: out/l78_bands/<scene>.npz (S2 L2A crops, scripts/case/pairs_detector_review.py)
    composition:
      fold0:
        acquisitions:
        - 36TUN_20240617
        - 37TCH_20240603
        scenes:
        - S4_DOORS3_T12
        - S4_DOORS3_T13
        - S4_DOORS3_T30
        - S4_DOORS3_T31
        objects_by_class:
          glint: 8
          cloud: 7
          unclear: 1
          seam_artifact: 1
      fold1:
        acquisitions:
        - 32ULF_20160411
        - 37TCG_20240603
        - 37TDG_20240603
        - 37TGG_20240607
        scenes:
        - S3_HE460_MarLitter_transect03
        - S4_DOORS3_T14
        - S4_DOORS3_T16
        - S4_DOORS3_T20
        - S4_DOORS3_T21
        objects_by_class:
          foam_whitecap: 50
          cloud: 13
          unclear: 12
          seam_artifact: 3
          glint: 3
          ship_wake: 2
          accumulation: 1
      fold2:
        acquisitions:
        - 32UMF_20160408
        - 35TQJ_20240602
        - 37TGG_20240612
