  extra: 'data/extra/features_*.npz + registry*.csv (L89/L90): same fold rule on tile_date;
    the composition is computed deterministically by the rule and written to out/detector_v2/extra_folds.json'
  metrics:
    D_false_alarm: share of D objects with max P(MD) over the object's pixels >= the
      model's val threshold; Wilson 95 % CI; inputs 'none' (as the service now) =
      primary, 'water_median' = secondary
    B_recall: share of B objects with max P >= threshold (and pixel recall); Wilson
      95 % CI
  descriptive_only: flag rate on 5000 random valid-water pixels per pair crop (22
    S2 crops, unlabelled; not used for decisions)
reference:
  weights: weights/lgbm
  model_sha256: 0eeebf43fcccd8c7c07f053b7ec723229d1a3c9b92d12eec1bdb269258c51470
  threshold: 0.63
  note: rollback; trained on MARIDA train + MADOS (config in its meta.json) - r0 re-trains
    the same config with seeds 0-2 to measure seed std
baselines:
  fdi_threshold: single FDI threshold + direction tuned on val (scripts/baselines.py
    sweep)
  rf: RandomForest MARIDA params (data/case/detector_preds/rf_seed5.joblib, sha256
    523a32d6529f3f5b...), trained on MARIDA train, 19 features; P(MD) >= t tuned on
    val, and argmax
acceptance:
  primary_project_rule: ACCEPT if mean_seeds F1_val(cand) - F1_val(reference) >= max(0.01,
    2*std_seeds(cand), 2*std_seeds(r0)) AND D false-alarm (none) not higher than reference
    by > 0.05 AND B recall (if B exists) not lower than reference by > 0.05
  secondary_domain_rule: DOMAIN CANDIDATE (orchestrator decides) if F1_val(cand) >=
    F1_val(reference) - 0.01 for the seed mean AND the D false-alarm rate (none) is
    lower than reference with exact McNemar p < 0.05 on the same D objects for every
    seed AND B recall non-inferior (-0.05)
  otherwise: REJECT (the rollback weights/lgbm stays)
