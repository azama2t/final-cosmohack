metric:
  unit: labelled pixels only (unlabelled MADOS pixels excluded, as the MADOS/MARIDA protocol)
  primary: pooled F1 of oil vs rest over all labelled pixels of the split
  also:
  - precision
  - recall
  - IoU
  - per-scene F1 on oil scenes
  ci: scene bootstrap 2000 reps, numpy default_rng(0), percentile 2.5/97.5
  nan_rule: pixel with a NaN band -> not oil
selection:
  only_on: val
  lgbm_threshold_grid:
  - 0.02
  - 0.98
  - 0.01
  baseline: OSI = (B3+B4)/B2 (Rajendran et al. 2021, MethodsX 8:101327); sign and threshold chosen on val (grid = 1..99 percentiles
    of val OSI)
  variants: a few LightGBM variants (features, pos_weight), seed 0; best val F1 -> final
test_policy: MADOS test oil scenes are evaluated ONCE at the end with frozen model + thresholds; the opening is recorded below
  (test_opened)
