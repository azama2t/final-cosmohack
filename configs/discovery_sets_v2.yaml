# Наборы оценщика v2 (правка 26.09 14:03, «ОЦЕНЩИК §35 — ИСПРАВИТЬ»). v1 (configs/discovery_sets.yaml) не удалён
# и не смешивается: строки лидерборда v1 — docs/research/discovery/LEADERBOARD_v1.csv. Записано ДО первого прогона на v2.
# Сборка: scripts/discovery/build_sets.py compose|fetch|tiles|freeze --version v2 (окна v1 связаны жёсткими ссылками,
# добавлены 21 дата PLP2021). Оценщик: scripts/discovery/harness.py (по умолчанию — этот файл).
version: v2
created: "2026-09-26 14:10"
window:
  size_px: 128
  bands: [B1, B2, B3, B4, B5, B6, B7, B8, B8A, B11, B12]
  units: "отражение 0..1, NaN = нет данных; 'SCL' (uint8, 0 = неизвестно); roi — meta['roi']"
method_contract:
  predict: "predict(window_bands, meta) -> (N, lo, hi) | None. None (или N = None) = «нет надёжной оценки» (воздержание)"
  predict_cover: "необязательно: predict_cover(window_bands, meta) -> (м², lo, hi) — площадь пластика в ROI (для PLP2021)"
  fit: "необязательно: fit(train) — train только из A1 (мишени), разбиение leave-one-CAMPAIGN-out"

sets:
  A1:
    name: "Мишени (A*) — ВЫВОД ОГРАНИЧЕН ИСКУССТВЕННЫМИ МИШЕНЯМИ"
    count_dates: "15 дат со счётом (как v1): PLP2018 (3 738), PLP2019 ×5 (бутылки по дрону; пакеты не посчитаны), Maathuis 2026 ×6 (360) + 2 контроля (0), Лимасол 2018 (1 500)"
    cover_dates: "PLP2021 ×21 (одна сетка HDPE ≈ 616 м²; истина — площадь пластика в ROI, м²; деревянная мишень не пластик; состояние сетки по датам (плавает/притоплена) не учитывается)"
    folds: "leave-one-CAMPAIGN/SITE-out: PLP2018 | PLP2019 | Maathuis2026 | Themistocleous2020 | PLP2021 (по доле). Для каждой кампании fit() получает только остальные кампании (включая PLP2021 с cover_m2), затем предсказываются все даты кампании"
    metrics:
      E1: "ошибка числа: mean |log10((N̂+1)/(N+1))| по 15 датам со счётом (воздержание = N̂ 0)"
      B1: "смещение: mean log10((N̂+1)/(N+1)) (> 0 — завышение)"
      C1: "покрытие объявленного интервала: доля дат с lo ≤ N ≤ hi (воздержание = не покрыто)"
      Ec: "только при predict_cover: mean |log10((ĉ+1)/(c+1))| по PLP2021, м²; иначе n/a"
  A2:
    name: "ADIS/CSV без видимого сигнала (66 + 11 пар; как v1)"
    note: "на всех парах плотности поля 1–1 000 шт./км² дают покрытие пикселя 10⁻⁷–10⁻⁴ — видимого сигнала нет (PAIRS.md)"
    metrics:
      ABST2: "доля пар, где метод КОРРЕКТНО ВОЗДЕРЖИВАЕТСЯ: None или N̂ < 1 в ROI (1.64 км²)"
      NUM2: "штраф: 1 − ABST2 — выдано число там, где сигнала нет"
      G2: "справочно: доля пар с ĉ ≥ 1 000 шт./км² при c < 100"
  A3:
    name: "Фон (как v1: MARIDA test 316, суда Финляндии 40, облака CMC 71)"
    metrics:
      FP3: "доля окон с N̂ ≥ 1 в ROI 32×32 (порог ≤ 1 %), по классам фона"
      Z3: >-
        ложные ЗОНЫ на полном окне: каждое окно A2 и A3 (1.64 км²) делится на 16 плиток 32×32; плитка положительна
        при N̂ ≥ 1; зона = 4-связная группа положительных плиток; Z3 = зон / км² (всего и по типам плиток: пена, суда,
        органика (саргассум/NOM), облака (облака+тени), блик (вода > 50 % плитки и медиана B11 воды > 0.03 — втрое выше
        правила масок пар 0.01, т. к. у MARIDA вода B11 ≈ 0.010), волны/следы, вода). Тип плитки: разметка MARIDA
        (≥ 3 пикс. класса, приоритет судно > пена > органика > облако > волны/следы; ≥ 1 пикс. «мусор» → плитка
        исключена), 4 центральные плитки окна судна Финляндии, 4 центральные плитки окна CMC (класс ручной маски),
        иначе блик/вода. Файл data/discovery/v2/tile_types.csv. Тип зоны — самый «приоритетный» тип её плиток.
  A4:
    name: "Cózar 2024 (уровень B) — только полнота ОБНАРУЖЕНИЯ нитей (плотность не проверяется)"
    metrics:
      R4: "доля нитей с N̂ ≥ 1 в ROI нити"
  A5:
    name: "Природные синхронные пары A (единственная проверка «спутник → число» на природе)"
    rule: "в набор входят только пары, подтверждённые критиком пар (исходный файл открыт, Δt, дрейф, масштаб, видимый сигнал); новая пара = новая версия наборов"
    n: 0
    candidates:
      - "P2-ISPRA-ER604-2019-09-16 (ISPRA MSFD Modulo 2bis, Порто-Гарибальди × S2B_32TQQ_20190916): кандидат A, ждёт ширину полосы и часовой пояс (docs/research/pairs/p2_natural.csv)"
    natural_counter_rule: "пока в A5 меньше 5 пар, НИ ОДИН метод не называется «природным счётчиком» — оценщик пишет это в каждой строке"

score:
  columns: "раздельные: E1, B1, C1, Ec, ABST2, G2, FP3, Z3 (+ по типам), R4, n_A5, natural_counter"
  reference_score: "SCORE = E1 + (1 − ABST2) + 10·max(0, FP3 − 0.01) + 0.25·(1 − R4) — только для сортировки, не вывод"
  bootstrap: "2000 повторов, seed 0, кластерный по группам (A1 — дата, A2 — пара, A3/A4 — сцена/патч; Z3 — по окнам сцены); парный ΔE1 против б1 по датам"
  product_gate: "в продукт (замена б1 в карточке зоны) — только если: верх 95 % ДИ ΔE1 (LOCO) < 0; ABST2 ≥ ABST2(б1); FP3 ≤ max(FP3(б1), 1 %); Z3 ≤ Z3(б1). Название «природный счётчик» — только при n_A5 ≥ 5 и отдельной проверке на A5"
baselines:
  b1_flat_plp: "детектор weights/lgbm, P ≥ 0.63 в ROI → N = n × 561 [470; 670] (исследовательский СЦЕНАРИЙ по мишеням PLP; утечка на A1: 470/670 из дат PLP2019)"
  b2_zero: "N = 0 всегда"
  b3_fdi_area: "FDI − медиана FDI воды > 0.03 → N = n × 561 [470; 670]"
forbidden:
  - "подбирать под A1 вне fit() (fit видит только другие кампании)"
  - "поля-ответы как признаки (labels.csv, tile_types.csv, p1_*.csv, adis_candidates.csv, pair_quality.csv, registry_cozar*.csv)"
  - "учиться на окнах A2–A5 (в т. ч. MARIDA test)"
  - "угадывать набор по meta и ветвиться по нему"
frozen:   # записано build_sets.py freeze до первого прогона методов; harness проверяет перед каждым прогоном
  at: '2026-09-26 14:12'
  manifest: data/discovery/v2/manifest.csv
  manifest_sha256: 3dd68b1d763f68dacb4f81e79513c7865dfa8209108a87daf407907d6a1e9afd
  labels: data/discovery/v2/labels.csv
  labels_sha256: eff1feae79455ef97be3e989737c580a1e63ee1084683e3bae5b1c0abf5e57d9
  tile_types: data/discovery/v2/tile_types.csv
  tile_types_sha256: 96d71f34b822a145261b14e7f5d12444d936e255f434eb82525ba27ff75a9917
  n_ok: {"A1": 36, "A2": 77, "A3": 427, "A4": 35}
  missing: []
